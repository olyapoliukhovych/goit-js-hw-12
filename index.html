<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/goit-js-hw-12/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixabay</title>
    <script type="module" crossorigin src="/goit-js-hw-12/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-12/assets/vendor-Cx9ob2aQ.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/vendor-Dr4k8ETB.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/index-BiQB5R7R.css">
  </head>
  <body>
    <header class="header"></header>

    <main>
      <div class="container">
        <!-- form -->
        <form class="form">
          <label>
            <input
              type="text"
              name="search-text"
              id="input"
              placeholder="Search images..."
              required
            />
          </label>
          <button type="submit">Search</button>
        </form>

        <!-- loader -->
        <span class="loader hidden"></span>

        <!-- gallery -->
        <ul class="gallery" id="gallery"></ul>

        <!-- load more button -->
        <button type="button" class="load-more-button hidden">Load more</button>

        <!-- loader -->
        <span class="load-more-loader hidden"></span>

        <!-- pixabay logo -->
        <a href="https://pixabay.com/" target="_blank"
          ><img
            class="pixabay-logo"
            src="/goit-js-hw-12/assets/pixabay-CqotO98l.png"
            alt="pixabay logo"
            width="100"
        /></a>

        <!-- arrow up -->
        <a class="svg-container" href="#input">
          <svg class="icon" width="32" height="32">
            <use href="/goit-js-hw-12/arrow-up.svg"></use>
          </svg>
        </a>
      </div>
    </main>

  </body>
</html>
